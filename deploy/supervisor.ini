[program:sh-ai]
command=PYTHON_BIN main:app --host 0.0.0.0 --port 8000
directory=PROJECT_DIR
user=root
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=PROJECT_DIR/backend.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
environment=PYTHONUNBUFFERED="1"
