version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: sh-ai-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${DB_NAME:-event_assistant}
      MYSQL_USER: ${DB_USER:-shai}
      MYSQL_PASSWORD: ${DB_PASSWORD:-shai123456}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sh-ai-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://shai:shai123456@mysql:3306/event_assistant?charset=utf8mb4}
    volumes:
      - ./static/uploads:/app/static/uploads
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: sh-ai-frontend
    restart: unless-stopped
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static/uploads:/usr/share/nginx/static/uploads:ro
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
