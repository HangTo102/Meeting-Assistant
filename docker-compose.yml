# ============================================
# 会场精灵 - Docker Compose 编排
# 使用前：cp .env.example .env 并按需修改
# 启动：docker compose up -d --build
# ============================================

services:
  # ---------- 数据库 ----------
  mysql:
    image: mysql:8.0
    container_name: sh-ai-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${DB_NAME:-event_assistant}
      MYSQL_USER: ${DB_USER:-shai}
      MYSQL_PASSWORD: ${DB_PASSWORD:-shai123456}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    # 仅本机可访问，不对外暴露（安全）
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------- 后端 ----------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    container_name: sh-ai-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://shai:shai123456@mysql:3306/event_assistant?charset=utf8mb4}
      TZ: Asia/Shanghai
    volumes:
      - ./static/uploads:/app/static/uploads
    # 仅本机可访问（调试用），正式环境可删除
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  # ---------- 前端（Nginx）----------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_AMAP_KEY: ${VITE_AMAP_KEY:-}
        VITE_AMAP_SECURITY_CODE: ${VITE_AMAP_SECURITY_CODE:-}
    container_name: sh-ai-frontend
    restart: unless-stopped
    volumes:
      - ./static/uploads:/usr/share/nginx/static/uploads:ro
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
