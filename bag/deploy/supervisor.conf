# 会场精灵后端进程守护配置
# 部署位置：/etc/supervisor/conf.d/sh-ai.conf
[program:sh-ai]
command=/home/ubuntu/sh-ai/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000
directory=/home/ubuntu/sh-ai
user=ubuntu
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/home/ubuntu/sh-ai/backend.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
environment=PYTHONUNBUFFERED="1"
