# 会场精灵 Nginx 配置
# 部署位置：/etc/nginx/sites-available/sh-ai
# 使用前请把 yourdomain.com 替换为你的实际域名
#
# 重要：HTTP -> HTTPS 强制跳转
# 浏览器只在 HTTPS（安全上下文）下开放高精度定位，必须启用 HTTPS 才能实现“走到哪定位追到哪”

# ---------- HTTP（80 端口，强制跳转 HTTPS）----------
server {
    listen 80;
    server_name yourdomain.com;

    # Let's Encrypt 证书续期验证目录（证书签发后保留）
    location /.well-known/acme-challenge/ {
        root /var/www/sh-ai;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS（443 端口）----------
server {
    listen 443 ssl;
    server_name yourdomain.com;

    # SSL 证书（用 certbot 免费签发后自动写入）
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100m;

    # 前端静态文件
    root /var/www/sh-ai/frontend/dist;
    index index.html;

    # 前端页面路由（Vue Router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传文件静态目录
    location /static/ {
        alias /var/www/sh-ai/static/;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 日志
    access_log /var/log/nginx/sh-ai-access.log;
    error_log  /var/log/nginx/sh-ai-error.log;
}
